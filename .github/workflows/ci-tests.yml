name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ADMIN_TEST_JWT: ${{ secrets.SUPABASE_ADMIN_TEST_JWT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test:all

      - name: Run strict admin integration checks
        if: ${{ env.SUPABASE_ADMIN_TEST_JWT != '' }}
        env:
          REQUIRE_ADMIN_SUCCESS: true
        run: npm run test:integration

      - name: Run production build
        run: npm run build
