name = "steadfast-realtime-chat"
main = "src/index.ts"
compatibility_date = "2026-03-26"
workers_dev = true

[[durable_objects.bindings]]
name = "CHAT_DO"
class_name = "ConversationDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationDurableObject"]

[[d1_databases]]
binding = "CHAT_DB"
database_name = "steadfast-realtime-chat-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
CHAT_AUTH_TOKEN = "REPLACE_WITH_LONG_RANDOM_TOKEN"
SUPABASE_JWT_SECRET = "REPLACE_WITH_SUPABASE_JWT_SECRET"
ADMIN_ROLE_NAMES = "admin,super_admin"
USER_ROLE_NAMES = "user,member"
SLA_BREACH_MINUTES = "30"
MAX_RETRY_ATTEMPTS = "2"
WS_TICKET_TTL_SECONDS = "45"
CHAT_REQUIRE_USER_JWT = "false"
SLA_AUTO_ESCALATE = "false"

[env.production]
workers_dev = false
routes = [
  { pattern = "chat-api.steadfast.example.com/*", zone_name = "steadfast.example.com" }
]

[env.production.vars]
ADMIN_ROLE_NAMES = "admin,super_admin"
USER_ROLE_NAMES = "user,member"
SLA_BREACH_MINUTES = "30"
MAX_RETRY_ATTEMPTS = "2"
WS_TICKET_TTL_SECONDS = "45"
CHAT_REQUIRE_USER_JWT = "false"
SLA_AUTO_ESCALATE = "false"
